<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог тестов — Ньютон</title>
<style>
  :root {
    --bg: #f4f5ea; --bg-card: #fdfdf7; --ink: #20221a; --ink-soft: #5c6152;
    --ink-faint: #8a8f7c; --accent: #5f6a3d; --accent-soft: #e6e9d6;
    --accent-line: #c3cc9e; --rule: #dcd9c4; --rule-strong: #bdb890;
    --field-bg: #fbfbf1; --ok: #2c6e8a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14160f; --bg-card: #1b1e14; --ink: #e7e6da; --ink-soft: #9da393;
      --ink-faint: #6d7264; --accent: #9cb57a; --accent-soft: #232a19;
      --accent-line: #3a4429; --rule: #2a2d20; --rule-strong: #3c4030;
      --field-bg: #15170f; --ok: #6fb8d4;
    }
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); margin: 0;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  h1, h2 { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; margin: 0; }

  #app { max-width: 760px; margin: 0 auto; padding: 44px 20px 70px; }

  .brand { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 12px; }
  h1 { font-size: 1.9rem; margin-bottom: 8px; }
  .lede { color: var(--ink-soft); max-width: 56ch; margin-bottom: 8px; }
  .count { font-size: 0.85rem; color: var(--ink-faint); margin-bottom: 34px; font-variant-numeric: tabular-nums; }

  .grid { display: grid; gap: 16px; }

  .card {
    background: var(--bg-card); border: 1px solid var(--rule); border-radius: 8px;
    padding: 20px 22px;
  }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .badge {
    display: inline-block; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-line);
    border-radius: 20px; padding: 3px 11px; font-weight: 600; white-space: nowrap;
  }
  .card h2 { font-size: 1.15rem; margin: 10px 0 6px; }
  .card .desc { color: var(--ink-soft); font-size: 0.92rem; margin-bottom: 14px; max-width: 60ch; }
  .meta-row { display: flex; gap: 16px; font-size: 0.8rem; color: var(--ink-faint); margin-bottom: 16px; flex-wrap: wrap; }
  .meta-row b { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .btn-open {
    display: inline-block; background: var(--accent); color: var(--bg-card); text-decoration: none;
    font-weight: 600; padding: 10px 18px; border-radius: 6px; font-size: 0.88rem;
  }
  .btn-open:hover { filter: brightness(1.08); }
  .btn-copy {
    background: transparent; border: 1px solid var(--rule-strong); color: var(--ink);
    border-radius: 6px; padding: 10px 16px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .btn-copy.done { border-color: var(--ok); color: var(--ok); }
  .link-shown { font-size: 0.78rem; color: var(--ink-faint); word-break: break-all; margin-left: auto; }

  .empty-note {
    border: 1px dashed var(--rule-strong); border-radius: 8px; padding: 18px 20px;
    color: var(--ink-faint); font-size: 0.85rem; text-align: center; margin-top: 6px;
  }

  .folder-card {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    background: var(--bg-card); border: 1px solid var(--rule); border-radius: 8px;
    padding: 22px 24px; cursor: pointer; text-align: left; width: 100%;
    font-family: inherit; color: var(--ink);
  }
  .folder-card:hover { border-color: var(--accent-line); background: var(--accent-soft); }
  .folder-mark {
    width: 40px; height: 40px; flex: none; border-radius: 8px;
    background: var(--accent-soft); border: 1px solid var(--accent-line);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: var(--accent); font-size: 1rem;
  }
  .folder-info { flex: 1; }
  .folder-info .fname { font-size: 1.05rem; font-weight: 700; }
  .folder-info .fcount { font-size: 0.82rem; color: var(--ink-faint); margin-top: 2px; }
  .folder-arrow { color: var(--ink-faint); font-size: 1.2rem; }

  .back-link {
    display: inline-flex; align-items: center; gap: 6px; background: none; border: none;
    color: var(--ink-soft); font-size: 0.85rem; cursor: pointer; padding: 0; margin-bottom: 22px;
    font-family: inherit;
  }
  .back-link:hover { color: var(--ink); }

  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    .link-shown { display: none; }
    .card-top { flex-direction: column; }
  }
</style>

</div>

        { grade: "11 класс", title: "Входной тест по биологии", description: "Диагностика знаний за курс 10 класса для тех, кто перешёл в 11-й: молекулярная биология, клеточный цикл, генетика углублённо, онтогенез.", duration: "45 мин", questions: 16, maxScore: 30, url: "https://claude.ai/code/artifact/0f479d3d-890b-46f0-8ba9-280e2ecd3194" }
      ]
    },
    {

      tests: [
        { grade: "5 класс", title: "Входной тест по истории", description: "Проверка готовности к старту истории в 5 классе: время и счёт лет, ключевые исторические понятия, базовые сведения по истории России из начальной школы.", duration: "45 мин", questions: 16, maxScore: 30, url: "https://claude.ai/code/artifact/6982adbd-bf93-4215-ae2e-6c5b5b2c913a" },
        { grade: "6 класс", title: "Входной тест по истории", description: "Диагностика знаний за курс 5 класса (История Древнего мира) для тех, кто перешёл в 6-й: Древний Египет, Древняя Греция, Древний Рим, Древний Восток.", duration: "45 мин", questions: 16, maxScore: 30, url: "https://claude.ai/code/artifact/4b2031dd-74fb-46a9-9e64-1e5ccead2786" },

        { grade: "8 класс", title: "Входной тест по истории", description: "Диагностика знаний за курс 7 класса для тех, кто перешёл в 8-й: Великие географические открытия, Реформация в Европе, эпоха Ивана Грозного и опричнина, начало Смутного времени.", duration: "45 мин", questions: 16, maxScore: 30, url: "https://claude.ai/code/artifact/9d6ea9f2-3b7a-44c8-acb4-da591d152adc" },
        { grade: "9 класс", title: "Входной тест по истории", description: "Диагностика знаний за курс 8 класса для тех, кто перешёл в 9-й: реформы Петра I, эпоха Екатерины II, Великая французская революция, промышленный переворот, Отечественная война 1812 года.", duration: "45 мин", questions: 16, maxScore: 30, url: "https://claude.ai/code/artifact/160f4329-ffee-4fda-8fd8-9fbba8b4fa20" },
        { grade: "10 класс", title: "Входной тест по истории", description: "Диагностика знаний за курс 9 класса для тех, кто перешёл в 10-й: реформы Александра II и отмена крепостного права, революционное движение, Первая мировая война, революции 1917 года.", duration: "45 мин", questions: 16, maxScore: 30, url: "https://claude.ai/code/artifact/48ba8c21-738a-4d23-9a23-50f61ed26e8f" },
        { grade: "11 класс", title: "Входной тест по истории", description: "Диагностика знаний за курс 10 класса для тех, кто перешёл в 11-й: образование СССР, индустриализация и коллективизация, Великая Отечественная война, Холодная война, распад СССР.", duration: "45 мин", questions: 16, maxScore: 30, url: "https://claude.ai/code/artifact/0ce89b36-404e-4b34-a596-f8f8090dcc2d" }
      ]
    }
  ];

  const folderGrid = document.getElementById('folderGrid');
  const testGrid = document.getElementById('testGrid');
  const backLink = document.getElementById('backLink');
  const countLabel = document.getElementById('countLabel');
  const pageTitle = document.getElementById('pageTitle');
  const pageLede = document.getElementById('pageLede');
  const emptyNote = document.getElementById('emptyNote');

  function totalTests() {
    return SUBJECTS.reduce((s, subj) => s + subj.tests.length, 0);
  }

  function renderFolders() {
    folderGrid.innerHTML = '';
    SUBJECTS.forEach(subj => {
      const card = document.createElement('button');
      card.className = 'folder-card';
      card.type = 'button';
      card.innerHTML = `
        <div class="folder-mark">${subj.name.slice(0, 2).toUpperCase()}</div>
        <div class="folder-info">
          <div class="fname">${subj.name}</div>
          <div class="fcount">${subj.tests.length} ${subj.tests.length === 1 ? 'тест' : 'теста'}</div>
        </div>
        <div class="folder-arrow">→</div>
      `;
      card.addEventListener('click', () => openSubject(subj.id));
      folderGrid.appendChild(card);
    });

    pageTitle.textContent = 'Каталог тестов';
    pageLede.textContent = 'Выберите папку с предметом, затем нужный тест — и отправьте ссылку ученику в любой удобный мессенджер.';
    countLabel.textContent = totalTests() + ' ' + (totalTests() === 1 ? 'тест' : 'тестов') + ' в ' + SUBJECTS.length + (SUBJECTS.length === 1 ? ' папке' : ' папках');
    backLink.hidden = true;
    folderGrid.hidden = false;
    testGrid.hidden = true;
    emptyNote.hidden = false;
  }

  function renderTests(subj) {
    testGrid.innerHTML = '';
    subj.tests.forEach(t => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <span class="badge">${subj.name} · ${t.grade}</span>
        </div>
        <h2>${t.title}</h2>
        <p class="desc">${t.description}</p>
        <div class="meta-row">
          <span><b>${t.duration}</b> на выполнение</span>
          <span><b>${t.questions}</b> заданий</span>
          <span><b>${t.maxScore}</b> баллов максимум</span>
        </div>
        <div class="actions">
          <a class="btn-open" href="${t.url}" target="_blank" rel="noopener">Открыть тест</a>
          <button class="btn-copy" data-url="${t.url}" type="button">Скопировать ссылку</button>
          <span class="link-shown">${t.url}</span>
        </div>
      `;
      testGrid.appendChild(card);
    });

    pageTitle.textContent = subj.name;
    pageLede.textContent = 'Откройте нужный тест или скопируйте ссылку, чтобы отправить её ученику.';
    countLabel.textContent = subj.tests.length + (subj.tests.length === 1 ? ' тест в папке' : ' теста(ов) в папке');
    backLink.hidden = false;
    folderGrid.hidden = true;
    testGrid.hidden = false;
    emptyNote.hidden = true;
  }

  function openSubject(id) {
    const subj = SUBJECTS.find(s => s.id === id);
    if (subj) renderTests(subj);
  }

  backLink.addEventListener('click', renderFolders);

  testGrid.addEventListener('click', function (e) {
    const btn = e.target.closest('.btn-copy');
    if (!btn) return;
    const url = btn.getAttribute('data-url');
    const done = () => {
      const original = 'Скопировать ссылку';
      btn.textContent = 'Ссылка скопирована';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = original; btn.classList.remove('done'); }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
    } else {
      fallbackCopy(url, done);
    }
  });

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  renderFolders();
</script>
