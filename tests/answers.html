<style>
  :root {
    --bg: #f4f5ea; --bg-card: #fdfdf7; --ink: #20221a; --ink-soft: #5c6152;
    --ink-faint: #8a8f7c; --accent: #5f6a3d; --accent-soft: #e6e9d6;
    --accent-line: #c3cc9e; --rule: #dcd9c4; --warn: #a3271d;
    --field-bg: #fbfbf1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14160f; --bg-card: #1b1e14; --ink: #e7e6da; --ink-soft: #9da393;
      --ink-faint: #6d7264; --accent: #9cb57a; --accent-soft: #232a19;
      --accent-line: #3a4429; --rule: #2a2d20; --warn: #e2857a;
      --field-bg: #15170f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  #gate {
    background: var(--bg-card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 36px 32px; max-width: 340px; width: 100%; text-align: center;
  }
  #gate h1 { font-size: 1.2rem; margin: 0 0 8px; }
  #gate p { color: var(--ink-soft); font-size: 0.88rem; margin: 0 0 20px; }
  #gate input {
    width: 100%; background: var(--field-bg); border: 1px solid var(--rule); border-radius: 6px;
    padding: 11px 14px; font-size: 1rem; color: var(--ink); text-align: center;
    letter-spacing: 0.2em; margin-bottom: 14px; font-family: inherit;
  }
  #gate button {
    width: 100%; background: var(--accent); color: var(--bg-card); border: none;
    border-radius: 6px; padding: 11px 14px; font-size: 0.92rem; font-weight: 600; cursor: pointer;
  }
  #gate button:hover { filter: brightness(1.08); }
  #err { color: var(--warn); font-size: 0.82rem; margin-top: 12px; min-height: 1em; }
  iframe { border: none; width: 100%; height: 100vh; display: none; }
</style>
</head>

function b64d(s) {
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function tryUnlock(password) {
  const salt = b64d(ENC.salt);
  const iv = b64d(ENC.iv);
  const payload = b64d(ENC.data);
  const ciphertext = payload.slice(0, payload.length - 16);
  const authTag = payload.slice(payload.length - 16);
  const combined = new Uint8Array(ciphertext.length + authTag.length);
  combined.set(ciphertext, 0);
  combined.set(authTag, ciphertext.length);

  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );

  const decrypted = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv }, key, combined
  );
  return new TextDecoder().decode(decrypted);
}

document.getElementById('unlock').addEventListener('click', doUnlock);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') doUnlock(); });

async function doUnlock() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const html = await tryUnlock(pw);
    const iframe = document.getElementById('content');
    iframe.srcdoc = html;
    iframe.style.display = 'block';
    document.getElementById('gate').style.display = 'none';
  } catch (e) {
    err.textContent = 'Неверный пароль';
  }
}
</script>
