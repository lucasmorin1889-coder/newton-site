<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по обществознанию — 8 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=3">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "society_8",
  subject: "Обществознание",
  grade: "8 класс",
  title: "Входной тест по обществознанию",
  description: "Диагностика знаний за курс 7 класса для тех, кто перешёл в 8-й: социальные нормы, отклоняющееся поведение, человек и экономика, человек и природа.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Социальные нормы и экономика семьи", meta: "5 заданий · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Как называется социальная норма, установленная и охраняемая государством, обязательная для всех и обеспеченная возможностью государственного принуждения?", unit: "слово", answer: ["право"] },
        { id: "q2", num: 2, text: "Как называется система норм о добре и зле, справедливости и долге, которая поддерживается силой общественного мнения, а не государством?", unit: "слово", answer: ["мораль"] },
        { id: "q3", num: 3, text: "Каждый год семья на Новый год наряжает ёлку — так поступали ещё её бабушки и дедушки. Как называется норма поведения, сложившаяся исторически и передающаяся из поколения в поколение?", unit: "слово", answer: ["обычай"] },
        { id: "q4", num: 4, text: "Мама работает бухгалтером и в конце месяца получает от работодателя денежное вознаграждение за свой труд. Как называется эта денежная выплата?", unit: "слово", answer: ["зарплата", "заработнаяплата"] },
        { id: "q5", num: 5, text: "Сосед по даче отдал соседу мешок картошки, а взамен получил вёдро яблок — деньги при этом не использовались. Как называется такой прямой обмен одного товара на другой?", unit: "слово", answer: ["бартер"] },
      ]
    },
    {
      title: "Часть 2. Отклонения и ответственность", meta: "4 задания · 1 балл каждое",
      questions: [
        { id: "q6", num: 6, text: "Подросток регулярно прогуливает уроки и грубит учителям, нарушая принятые в школе и обществе правила. Как называется поведение, не соответствующее принятым в обществе нормам?", unit: "термин", answer: ["девиантное", "отклоняющееся"] },
        { id: "q7", num: 7, text: "В отличие от норм морали, которые поддерживаются общественным осуждением, правовые нормы устанавливаются и обеспечиваются силой кого?", unit: "слово", answer: ["государства"] },
        { id: "q8", num: 8, text: "Верно ли, что за одно и то же деяние человек может нести одновременно и моральную, и юридическую ответственность (например, за кражу его осудят и по закону, и в глазах окружающих)?", unit: "да/нет", answer: ["да"] },
        { id: "q9", num: 9, text: "Как называются неблагоприятные последствия (штраф, арест, возмещение вреда), которые наступают для лица, нарушившего правовые нормы?", unit: "термин", answer: ["ответственность", "юридическаяответственность"] },
      ]
    },
    {
      title: "Часть 3. Человек и экономика", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "Как называется целесообразная деятельность людей, направленная на создание материальных и духовных благ и требующая физических или умственных усилий?", unit: "слово", answer: ["труд"] },
        { id: "q11", num: 11, text: "Пекарь продаёт хлеб на рынке, а покупатели отдают за него деньги — товары и услуги переходят от одних людей к другим. Как называется такое взаимодействие производителей и потребителей?", unit: "слово", answer: ["обмен", "торговля"] },
        { id: "q12", num: 12, text: "Если спрос покупателей на товар растёт, а его количество на рынке остаётся прежним, что происходит с ценой этого товара?", unit: "слово", answer: ["увеличивается", "растёт", "повышается"] },
      ]
    },
    {
      title: "Часть 4. Человек и природа", meta: "2 задания · 2 балла каждое",
      questions: [
        { id: "q13", num: 13, text: "Ученики бережно относятся к лесу во время похода: не оставляют мусор и не ломают деревья. Какую культуру поведения, связанную с заботой об окружающей среде, они проявляют?", unit: "термин", answer: ["экологическая"] },
        { id: "q14", num: 14, text: "Государство создаёт заповедники и национальные парки, чтобы сохранить редкие виды растений и животных. Как называется такая деятельность, направленная на защиту и восстановление природы?", unit: "термин", answer: ["природоохранная", "охранаприроды", "экологическая"] },
      ]
    },
    {
      title: "Часть 5. Практические задачи", meta: "11 баллов",
      questions: [
        { id: "q15", num: 15, text: "Рабочий на заводе получает 200 рублей за каждый час работы. Сколько рублей он заработает за 9-часовую смену?", unit: "₽", answer: 1800 },
        { id: "q16", num: 16, text: "Школьники посадили аллею возле школы: 8 берёз и 7 клёнов. Сколько всего деревьев они посадили?", unit: "деревьев", answer: 15 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=3"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
