<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по обществознанию — 6 класс — Ньютон</title>
<meta name="description" content="Проверка общей социальной грамотности перед стартом курса обществознания: семья, потребности человека, государственные символы, права гражданина. Бесплатный онлайн-тест от образовательного центра Ньютон, Петрозаводск.">
<link rel="canonical" href="https://newton-petrozavodsk.ru/tests/society/6/">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=3">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "society_6",
  subject: "Обществознание",
  grade: "6 класс",
  title: "Входной тест по обществознанию",
  description: "Проверка общей социальной грамотности перед стартом курса обществознания: семья, потребности человека, государственные символы, права гражданина.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Человек и его потребности", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Как называется малая социальная группа, основанная на браке или родстве, в которой человек получает первую заботу, любовь и воспитание?", unit: "слово", answer: ["семья"] },
        { id: "q2", num: 2, text: "Человеку необходимы пища, вода, сон и воздух. К какой группе потребностей это относится?", unit: "вид потребностей", answer: ["биологические", "физиологические"] },
        { id: "q3", num: 3, text: "Стремление к дружбе, общению и творческому самовыражению относится к потребностям, которые называют социальными или ещё как?", unit: "вид потребностей", answer: ["социальные", "духовные"] },
      ]
    },
    {
      title: "Часть 2. Гражданин и документы", meta: "2 задания · 2 балла каждое",
      questions: [
        { id: "q4", num: 4, text: "Семикласснице Насте исполнилось 14 лет, и родители повели её в МФЦ оформлять главный документ, удостоверяющий личность гражданина России. Назовите этот документ.", unit: "документ", answer: ["паспорт"] },
        { id: "q5", num: 5, text: "В каком возрасте гражданин России впервые получает этот документ?", unit: "лет", answer: 14 },
      ]
    },
    {
      title: "Часть 3. Государственные символы", meta: "4 задания · 1 балл каждое",
      questions: [
        { id: "q6", num: 6, text: "Как называется денежная единица (валюта) Российской Федерации?", unit: "слово", answer: ["рубль"] },
        { id: "q7", num: 7, text: "1 сентября на школьной линейке в честь начала учебного года звучит торжественное музыкальное произведение — один из государственных символов страны. Назовите его.", unit: "слово", answer: ["гимн"] },
        { id: "q8", num: 8, text: "Как называется официальный отличительный знак государства — изображение двуглавого орла, размещаемое на паспорте, монетах и печатях?", unit: "слово", answer: ["герб"] },
        { id: "q9", num: 9, text: "Флаг России состоит из трёх горизонтальных полос — белой, синей и ещё одной. Какого цвета нижняя полоса флага?", unit: "цвет", answer: ["красный"] },
      ]
    },
    {
      title: "Часть 4. Права и обязанности гражданина", meta: "5 заданий · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "Как называется человек, имеющий устойчивую правовую связь с государством, то есть обладающий его правами и несущий обязанности?", unit: "слово", answer: ["гражданин"] },
        { id: "q11", num: 11, text: "Десятилетнему Ване одноклассники предложили выбрать старосту класса тайным голосованием, а он ответил, что настоящее право голосовать на государственных выборах у него появится только в 18 лет. Может ли 10-летний ребёнок участвовать в выборах органов власти?", unit: "да/нет", answer: ["нет"] },
        { id: "q12", num: 12, text: "Как называется основной закон государства, обладающий высшей юридической силой, которому должны соответствовать все остальные законы?", unit: "слово", answer: ["конституция"] },
        { id: "q13", num: 13, text: "Зачем обществу нужны законы и правила поведения — что одним словом они помогают обеспечить в жизни людей (порядок, согласие или безопасность)?", unit: "слово", answer: ["порядок", "согласие", "безопасность"] },
        { id: "q14", num: 14, text: "Ученик опоздал на урок без уважительной причины — это нарушение школьных правил, но не преступление. Как называется такое незначительное нарушение установленных правил?", unit: "слово", answer: ["проступок", "нарушение"] },
      ]
    },
    {
      title: "Часть 5. Практические задачи", meta: "9 баллов",
      questions: [
        { id: "q15", num: 15, text: "Сейчас Никите 12 лет. Через сколько лет он сможет получить паспорт гражданина РФ, если это происходит в 14 лет?", unit: "число", answer: 2 },
        { id: "q16", num: 16, text: "Семья зарабатывает 50 000 рублей в месяц. На еду, коммунальные услуги и транспорт уходит 30 000 рублей. Сколько рублей остаётся на другие нужды семьи?", unit: "₽", answer: 20000 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=3"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
