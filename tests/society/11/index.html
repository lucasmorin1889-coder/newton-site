<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по обществознанию — 11 класс — Ньютон</title>
<meta name="description" content="Диагностика знаний за курс 10 класса для тех, кто перешёл в 11-й: экономика, социальные отношения, политика и право. Бесплатный онлайн-тест от образовательного центра Ньютон, Петрозаводск.">
<link rel="canonical" href="https://newton-petrozavodsk.ru/tests/society/11/">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=5">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя или ученика</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "society_11",
  subject: "Обществознание",
  grade: "11 класс",
  title: "Входной тест по обществознанию",
  description: "Диагностика знаний за курс 10 класса для тех, кто перешёл в 11-й: экономика, социальные отношения, политика и право.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Рыночная экономика", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Как называется система экономических отношений между продавцами и покупателями, обеспечивающая обмен товарами через механизм спроса и предложения?", unit: "слово", answer: ["рынок"] },
        { id: "q2", num: 2, text: "Труд, земля, капитал и предпринимательские способности — общее название ресурсов, необходимых для производства товаров и услуг. Как оно называется?", unit: "термин", answer: ["факторыпроизводства"] },
        { id: "q3", num: 3, text: "За год цены в магазинах на большинство товаров устойчиво выросли, а на ту же сумму денег теперь можно купить меньше. Как называется такое обесценивание денег и рост общего уровня цен?", unit: "термин", answer: ["инфляция"] },
      ]
    },
    {
      title: "Часть 2. Государство и право", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q4", num: 4, text: "В России государственная власть делится на законодательную, исполнительную и судебную ветви, которые уравновешивают друг друга. Как называется этот принцип организации власти?", unit: "термин", answer: ["разделениевластей"] },
        { id: "q5", num: 5, text: "Российская Федерация состоит из республик, краёв, областей и других относительно самостоятельных субъектов, объединённых в единое государство. Как называется такая форма государственно-территориального устройства?", unit: "форма устройства", answer: ["федерация"] },
        { id: "q6", num: 6, text: "Семейное право, трудовое право и уголовное право регулируют разные группы общественных отношений. Как называется совокупность правовых норм, регулирующих одну однородную группу отношений?", unit: "термин", answer: ["отрасльправа", "отрасль"] },
      ]
    },
    {
      title: "Часть 3. Социальные отношения", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q7", num: 7, text: "В обществе одни люди обладают высоким доходом и властью, другие — средним достатком, третьи живут за чертой бедности. Как называется деление общества на такие слои?", unit: "термин", answer: ["стратификация", "расслоение"] },
        { id: "q8", num: 8, text: "Сын рабочего окончил университет и стал руководителем крупной компании, поднявшись по социальной лестнице. Как называется такое перемещение человека между социальными слоями?", unit: "термин", answer: ["мобильность"] },
        { id: "q9", num: 9, text: "Жильцы дома разделились во мнениях: одни хотят установить шлагбаум во дворе, другие — против, и спор перерастает в открытое столкновение интересов. Как называется такое столкновение противоположных интересов и целей?", unit: "слово", answer: ["конфликт"] },
      ]
    },
    {
      title: "Часть 4. Экономика и отрасли права", meta: "5 заданий · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "Государство устанавливает налоги, пошлины и минимальный размер оплаты труда, чтобы влиять на экономику страны. Как называется такое воздействие государства на экономику с помощью законов и других инструментов?", unit: "термин", answer: ["регулирование", "государственноерегулирование"] },
        { id: "q11", num: 11, text: "На рынок завезли рекордный урожай яблок, при этом желающих их купить осталось столько же, сколько раньше. Что произойдёт с ценой яблок?", unit: "слово", answer: ["уменьшается", "снижается", "падает"] },
        { id: "q12", num: 12, text: "Как называется представительный и законодательный орган власти в России, состоящий из Совета Федерации и Государственной Думы?", unit: "термин", answer: ["парламент", "федеральноесобрание"] },
        { id: "q13", num: 13, text: "Гражданин заключил с магазином договор купли-продажи холодильника. Какая отрасль права регулирует имущественные сделки между людьми и организациями?", unit: "отрасль права", answer: ["гражданское", "гражданскоеправо"] },
        { id: "q14", num: 14, text: "Суд определяет, какое наказание понесёт человек, совершивший кражу или другое опасное деяние. Какая отрасль права устанавливает, какие деяния являются преступлениями, и наказания за них?", unit: "отрасль права", answer: ["уголовное", "уголовноеправо"] },
      ]
    },
    {
      title: "Часть 5. Практические задачи", meta: "8 баллов",
      questions: [
        { id: "q15", num: 15, text: "Цена товара выросла со 100 до 110 рублей. На сколько процентов выросла цена?", unit: "%", answer: 10 },
        { id: "q16", num: 16, text: "Фирма получила прибыль 900 000 рублей и должна уплатить налог на прибыль по ставке 7%. Сколько тысяч рублей составит налог?", unit: "тыс. ₽", answer: 63 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=5"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
