<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по обществознанию — 7 класс — Ньютон</title>
<meta name="description" content="Диагностика знаний за курс 6 класса для тех, кто перешёл в 7-й: человек как биосоциальное существо, деятельность, потребности, малые группы. Бесплатный онлайн-тест от образовательного центра Ньютон, Петрозаводск.">
<link rel="canonical" href="https://newton-petrozavodsk.ru/tests/society/7/">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=5">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя или ученика</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "society_7",
  subject: "Обществознание",
  grade: "7 класс",
  title: "Входной тест по обществознанию",
  description: "Диагностика знаний за курс 6 класса для тех, кто перешёл в 7-й: человек как биосоциальное существо, деятельность, потребности, малые группы.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Человек и социализация", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Как называется существо, сочетающее в себе биологическую природу и способность жить в обществе, обладающее сознанием и речью?", unit: "слово", answer: ["человек"] },
        { id: "q2", num: 2, text: "Как называется процесс усвоения человеком норм, ценностей и правил поведения общества, благодаря которому он становится его полноценным членом?", unit: "термин", answer: ["социализация"] },
        { id: "q3", num: 3, text: "Как называется способ взаимодействия человека с окружающим миром, включающий цель, средства и результат (например, учёба или работа)?", unit: "термин", answer: ["деятельность"] },
      ]
    },
    {
      title: "Часть 2. Деятельность и потребности человека", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q4", num: 4, text: "Подросток устроился на летние каникулы помогать в семейном хозяйстве за плату. Какой вид деятельности направлен на получение практически полезного результата и удовлетворение материальных потребностей?", unit: "слово", answer: ["труд"] },
        { id: "q5", num: 5, text: "Малыши строят замок из кубиков, представляя себя рыцарями. Какой вид деятельности, характерный прежде всего для детей, воспроизводит реальные действия в условной, вымышленной ситуации?", unit: "слово", answer: ["игра"] },
        { id: "q6", num: 6, text: "Человеку необходимы пища, вода и сон, без которых невозможно физическое существование. К какой группе потребностей это относится?", unit: "вид потребностей", answer: ["физиологические", "биологические"] },
      ]
    },
    {
      title: "Часть 3. Малые группы", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q7", num: 7, text: "Семья, школьный класс и компания друзей — это объединения, где люди находятся в непосредственном личном контакте. Как называется такое небольшое объединение людей?", unit: "термин", answer: ["малаягруппа"] },
        { id: "q8", num: 8, text: "В походе туристическая группа единогласно слушается одного человека, который принимает решения и ведёт остальных за собой. Как называют такого участника группы?", unit: "слово", answer: ["лидер"] },
        { id: "q9", num: 9, text: "Одноклассники обмениваются информацией устно, произнося слова и фразы, а не жестами и мимикой. Как называется такое общение с помощью речи?", unit: "вид общения", answer: ["вербальное"] },
      ]
    },
    {
      title: "Часть 4. Потребности и общение", meta: "5 заданий · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "Ребёнок, оставшись один дома вечером, боится темноты и звонит родителям, чтобы почувствовать себя защищённым. Какую потребность он стремится удовлетворить?", unit: "потребность", answer: ["безопасность"] },
        { id: "q11", num: 11, text: "Подростку важно иметь друзей, быть принятым в компании и пользоваться уважением одноклассников. К какой группе потребностей это относится?", unit: "вид потребностей", answer: ["социальная"] },
        { id: "q12", num: 12, text: "Школьник каждый день ходит на уроки, читает книги и задаёт вопросы учителю, потому что ему интересно узнавать новое. Какую потребность он удовлетворяет?", unit: "слово", answer: ["знаний", "знания"] },
        { id: "q13", num: 13, text: "Двое ребят знают друг друга с детского сада, доверяют друг другу и всегда готовы прийти на помощь, хотя не являются родственниками. Как называются такие близкие отношения?", unit: "слово", answer: ["дружба"] },
        { id: "q14", num: 14, text: "Как называется процесс взаимодействия людей, в ходе которого они обмениваются информацией, мыслями и переживаниями?", unit: "слово", answer: ["общение"] },
      ]
    },
    {
      title: "Часть 5. Практические задания", meta: "11 баллов",
      questions: [
        { id: "q15", num: 15, text: "В школьном кружке робототехники занимаются 8 мальчиков и 12 девочек. Сколько всего человек в этой малой группе?", unit: "человек", answer: 20 },
        { id: "q16", num: 16, text: "Определите, к какому виду деятельности относится подготовка домашнего задания: 1 — труд, 2 — учение. Укажите номер правильного ответа.", unit: "номер ответа", answer: 2 },
      ]
    }
  ]
};
</script>
