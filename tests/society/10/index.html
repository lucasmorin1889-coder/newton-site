<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по обществознанию — 10 класс — Ньютон</title>
<meta name="description" content="Диагностика знаний за курс 9 класса для тех, кто перешёл в 10-й: политическая сфера, права и свободы человека, правонарушения, участие в политической жизни. Бесплатный онлайн-тест от образовательного центра Ньютон, Петрозаводск.">
<link rel="canonical" href="https://newton-petrozavodsk.ru/tests/society/10/">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=4">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "society_10",
  subject: "Обществознание",
  grade: "10 класс",
  title: "Входной тест по обществознанию",
  description: "Диагностика знаний за курс 9 класса для тех, кто перешёл в 10-й: политическая сфера, права и свободы человека, правонарушения, участие в политической жизни.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Государство и формы правления", meta: "4 задания · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Как называется политическая организация, обладающая суверенитетом и осуществляющая управление обществом на определённой территории с помощью аппарата власти?", unit: "слово", answer: ["государство"] },
        { id: "q2", num: 2, text: "Как называется независимость государства в его внутренних и внешних делах, верховенство государственной власти на своей территории?", unit: "термин", answer: ["суверенитет"] },
        { id: "q3", num: 3, text: "В одной из ближневосточных стран верховная власть принадлежит одному правителю и передаётся по наследству его детям. Как называется такая форма правления?", unit: "форма правления", answer: ["монархия"] },
        { id: "q4", num: 4, text: "В России высшие органы государственной власти — Президент и Государственная Дума — избираются гражданами на определённый срок. Как называется такая форма правления?", unit: "форма правления", answer: ["республика"] },
      ]
    },
    {
      title: "Часть 2. Конституция и гражданское общество", meta: "2 задания · 1 балл каждое",
      questions: [
        { id: "q5", num: 5, text: "Как называется основной закон государства, обладающий высшей юридической силой и закрепляющий основы строя, права и свободы человека?", unit: "слово", answer: ["конституция"] },
        { id: "q6", num: 6, text: "Родительский комитет школы, спортивная федерация и благотворительный фонд действуют независимо от государства, объединяя граждан для решения общих задач. Как называется совокупность таких негосударственных организаций и объединений?", unit: "термин", answer: ["гражданскоеобщество"] },
      ]
    },
    {
      title: "Часть 3. Правонарушения и ответственность", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q7", num: 7, text: "Водитель проехал на красный свет светофора — это виновное противоправное деяние, за которое предусмотрена юридическая ответственность. Как называется такое деяние?", unit: "термин", answer: ["правонарушение"] },
        { id: "q8", num: 8, text: "Гражданин совершил кражу из магазина — это самый опасный вид правонарушения, запрещённый Уголовным кодексом. Как называется такое деяние?", unit: "слово", answer: ["преступление"] },
        { id: "q9", num: 9, text: "С какого возраста гражданин России приобретает полную дееспособность и может самостоятельно осуществлять все свои гражданские права?", unit: "лет", answer: 18 },
      ]
    },
    {
      title: "Часть 4. Участие в политической жизни и права человека", meta: "5 заданий · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "В 1993 году граждане России всенародным голосованием приняли новую Конституцию страны. Как называется такое всенародное голосование по важному вопросу государственной жизни?", unit: "слово", answer: ["референдум"] },
        { id: "q11", num: 11, text: "Каждые несколько лет граждане приходят на участки и голосуют, избирая депутатов и Президента. Как называется такая процедура избрания должностных лиц путём голосования?", unit: "слово", answer: ["выборы"] },
        { id: "q12", num: 12, text: "С какого возраста гражданин России получает право избирать, то есть голосовать на выборах?", unit: "лет", answer: 18 },
        { id: "q13", num: 13, text: "Право участвовать в управлении делами государства, избирать и быть избранным относится к какой группе прав человека?", unit: "вид прав", answer: ["политические"] },
        { id: "q14", num: 14, text: "Право на труд, отдых, охрану здоровья и социальное обеспечение относится к какой группе прав человека?", unit: "вид прав", answer: ["социальные", "социальноэкономические"] },
      ]
    },
    {
      title: "Часть 5. Практические задачи", meta: "8 баллов",
      questions: [
        { id: "q15", num: 15, text: "В посёлке зарегистрировано 120 избирателей. На референдум пришла ровно половина из них. Сколько человек проголосовало?", unit: "человек", answer: 60 },
        { id: "q16", num: 16, text: "Государственная Дума избирается сроком на 5 лет, а Президент России — на больший срок. На сколько лет избирается Президент России?", unit: "лет", answer: 6 },
      ]
    }
  ]
};
</script>
