<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по обществознанию — 9 класс — Ньютон</title>
<meta name="description" content="Диагностика знаний за курс 8 класса для тех, кто перешёл в 9-й: личность и социализация, духовная культура, социальная структура, основы экономики. Бесплатный онлайн-тест от образовательного центра Ньютон, Петрозаводск.">
<link rel="canonical" href="https://newton-petrozavodsk.ru/tests/society/9/">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=4">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "society_9",
  subject: "Обществознание",
  grade: "9 класс",
  title: "Входной тест по обществознанию",
  description: "Диагностика знаний за курс 8 класса для тех, кто перешёл в 9-й: личность и социализация, духовная культура, социальная структура, основы экономики.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Личность и социализация", meta: "2 задания · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Как называется человек как носитель социально значимых качеств, сформировавшихся у него в процессе жизни в обществе?", unit: "слово", answer: ["личность"] },
        { id: "q2", num: 2, text: "Как называется процесс, в ходе которого индивид усваивает социальные роли, ценности и нормы общества и становится личностью?", unit: "термин", answer: ["социализация"] },
      ]
    },
    {
      title: "Часть 2. Духовная культура", meta: "2 задания · 1 балл каждое",
      questions: [
        { id: "q3", num: 3, text: "Учёные в лаборатории проводят эксперимент, чтобы получить точные, проверяемые данные о свойствах вещества. Какая форма духовной культуры даёт объективные знания о мире?", unit: "форма культуры", answer: ["наука"] },
        { id: "q4", num: 4, text: "Как называется целенаправленный процесс обучения и воспитания, в ходе которого человек получает систему знаний, умений и навыков?", unit: "слово", answer: ["образование"] },
      ]
    },
    {
      title: "Часть 3. Социальная структура общества", meta: "5 заданий · 2 балла каждое",
      questions: [
        { id: "q5", num: 5, text: "Врач, отец семейства и капитан городской сборной по футболу — все эти характеристики одного человека определяют его положение в обществе. Как называется такое положение?", unit: "термин", answer: ["статус", "социальныйстатус"] },
        { id: "q6", num: 6, text: "От врача окружающие ожидают внимательности и соблюдения врачебной тайны, а от учителя — терпения и справедливости. Как называется модель поведения, ожидаемая от человека в соответствии с его статусом?", unit: "термин", answer: ["роль", "социальнаяроль"] },
        { id: "q7", num: 7, text: "Учителя одной школы, объединённые общей профессией, образуют совокупность людей с общим значимым признаком. Как называется такая совокупность людей?", unit: "термин", answer: ["социальнаягруппа", "группа"] },
        { id: "q8", num: 8, text: "Выпускник техникума за десять лет упорной работы стал директором завода — так он перешёл из одной социальной группы в другую. Как называется такой переход человека между социальными группами?", unit: "термин", answer: ["мобильность"] },
        { id: "q9", num: 9, text: "Как называется разделение общества на слои, отличающиеся по уровню дохода, образования, власти и престижа?", unit: "термин", answer: ["стратификация", "расслоение"] },
      ]
    },
    {
      title: "Часть 4. Основы экономики и культуры", meta: "5 заданий · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "Перед Новым годом покупатели готовы приобретать мандарины по любой разумной цене — их желание и возможность купить товар растёт. Как называется такое желание и возможность покупателей приобрести товар?", unit: "слово", answer: ["спрос"] },
        { id: "q11", num: 11, text: "Фермеры готовы продать на рынке столько картофеля, сколько позволяет собранный урожай, по сложившейся цене. Как называется количество товара, которое производители готовы продать на рынке?", unit: "слово", answer: ["предложение"] },
        { id: "q12", num: 12, text: "Выпускник колледжа открыл собственную мастерскую по ремонту техники, работает на свой риск и стремится получить прибыль. Как называется такая самостоятельная деятельность?", unit: "термин", answer: ["предпринимательство"] },
        { id: "q13", num: 13, text: "Семья владеет квартирой, может в ней жить, сдавать в аренду или продать. Как называется право владеть, пользоваться и распоряжаться имуществом?", unit: "слово", answer: ["собственность"] },
        { id: "q14", num: 14, text: "Прихожане храма соблюдают посты, читают священные тексты и верят в сверхъестественное. Какая форма духовной культуры основана на вере в сверхъестественное?", unit: "форма культуры", answer: ["религия"] },
      ]
    },
    {
      title: "Часть 5. Практические задачи", meta: "6 баллов",
      questions: [
        { id: "q15", num: 15, text: "Предприниматель закупил партию товара за 1540 рублей, а продал её за 2000 рублей. Найдите его прибыль.", unit: "₽", answer: 460 },
        { id: "q16", num: 16, text: "Школа закупает тетради по 25 рублей за штуку и хочет купить 120 тетрадей. Сколько рублей для этого потребуется?", unit: "₽", answer: 3000 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=4"></script>
<script>NewtonTestEngine.init(TEST);</script>
