<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по истории — 9 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=3">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "history_9",
  subject: "История",
  grade: "9 класс",
  title: "Входной тест по истории",
  description: "Диагностика знаний за курс 8 класса для тех, кто перешёл в 9-й: реформы Петра I, эпоха Екатерины II, Великая французская революция, промышленный переворот, Отечественная война 1812 года.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Реформы Петра I", meta: "6 заданий · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Как называлось высшее государственное учреждение, созданное Петром I в 1711 году для управления страной в его отсутствие?", unit: "слово", answer: ["сенат"] },
        { id: "q2", num: 2, text: "Какой город, новую столицу России, Пётр I основал в 1703 году в устье Невы?", unit: "название", answer: ["санктпетербург", "петербург"] },
        { id: "q3", num: 3, text: "Как называлась введённая Петром I в 1724 году денежная подать, которую платил каждый мужчина податного сословия независимо от возраста и трудоспособности?", unit: "термин", answer: ["подушнаяподать"] },
        { id: "q4", num: 4, text: "Как называется документ 1722 года, который ввёл единую систему чинов и позволял получать дворянство за службу, а не только по происхождению?", unit: "название документа", answer: ["табельорангах"] },
        { id: "q5", num: 5, text: "Как называлась первая русская печатная газета, которая начала выходить по указу Петра I в 1703 году?", unit: "название", answer: ["ведомости"] },
        { id: "q6", num: 6, text: "Назовите морское сражение русского флота со шведами в 1714 году, ставшее первой крупной морской победой России в Северной войне.", unit: "название", answer: ["гангут", "гангутскоесражение"] },
      ]
    },
    {
      title: "Часть 2. Эпоха Екатерины II", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q7", num: 7, text: "Как называется политика Екатерины II, сочетавшая неограниченную власть монарха с идеями европейского Просвещения (переписка с Вольтером, забота о просвещении)?", unit: "термин", answer: ["просвещенныйабсолютизм"] },
        { id: "q8", num: 8, text: "Как называется указ Екатерины II 1785 года, закрепивший привилегии дворянского сословия — освобождение от податей и телесных наказаний?", unit: "название документа", answer: ["жалованнаяграмотадворянству", "жалованнаяграмота"] },
        { id: "q9", num: 9, text: "Назовите предводителя крупнейшего крестьянского восстания 1773–1775 годов, выдававшего себя за императора Петра III.", unit: "имя", answer: ["пугачев", "пугачёв"] },
      ]
    },
    {
      title: "Часть 3. Французская революция и промышленный переворот", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "В каком году во Франции началась революция, ознаменовавшаяся взятием Бастилии?", unit: "год", answer: 1789 },
        { id: "q11", num: 11, text: "Как называется переход от ручного труда к машинному производству, начавшийся в Англии во второй половине XVIII века?", unit: "термин", answer: ["промышленныйпереворот", "индустриализация"] },
        { id: "q12", num: 12, text: "Как называется принятый Учредительным собранием Франции в 1789 году документ, провозгласивший свободу, равенство и неотчуждаемые права личности?", unit: "название документа", answer: ["декларацияправчеловека", "декларацияправчеловекаигражданина", "декларация"] },
      ]
    },
    {
      title: "Часть 4. Отечественная война 1812 года", meta: "2 задания · 2 балла каждое",
      questions: [
        { id: "q13", num: 13, text: "Назовите главнокомандующего русской армией в Отечественной войне 1812 года.", unit: "имя", answer: ["кутузов"] },
        { id: "q14", num: 14, text: "Назовите крупнейшее сражение Отечественной войны 1812 года, произошедшее 26 августа (7 сентября) в 125 км от Москвы.", unit: "название", answer: ["бородино", "бородинскоесражение"] },
      ]
    },
    {
      title: "Часть 5. Практика: счёт лет", meta: "2 задания · 4 балла каждое",
      questions: [
        { id: "q15", num: 15, text: "Санкт-Петербург был основан в 1703 году, а Полтавская битва произошла в 1709 году. Сколько лет между этими событиями?", unit: "число лет", answer: 6 },
        { id: "q16", num: 16, text: "Пётр I начал самостоятельное правление в 1689 году, а Екатерина II взошла на престол в 1762 году. Сколько лет разделяет эти события?", unit: "число лет", answer: 73 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=3"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
