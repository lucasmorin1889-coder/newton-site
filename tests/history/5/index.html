<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по истории — 5 класс — Ньютон</title>
<meta name="description" content="Проверка готовности к старту истории в 5 классе: время и счёт лет, ключевые исторические понятия, базовые сведения по истории России из начальной школы. Бесплатный онлайн-тест от образовательного центра Ньютон, Петрозаводск.">
<link rel="canonical" href="https://newton-petrozavodsk.ru/tests/history/5/">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=4">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>

  grade: "5 класс",

    {

        { id: "q15", num: 15, text: "Сколько веков составляют одно тысячелетие?", unit: "число", answer: 10 },

</script>
<script src="/tests/engine.js?v=4"></script>
<script>NewtonTestEngine.init(TEST);</script>

</html>
