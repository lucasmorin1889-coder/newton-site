<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по истории — 7 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=2">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+7 9XX XXX-XX-XX">
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "history_7",
  subject: "История",
  grade: "7 класс",
  title: "Входной тест по истории",
  description: "Диагностика знаний за курс 6 класса для тех, кто перешёл в 7-й: феодализм и рыцарство средневековой Европы, крестовые походы, образование Древнерусского государства, монгольское нашествие.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Средневековая Европа: феодализм и рыцарство", meta: "6 заданий · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Как называется общественный строй средневековой Европы, основанный на владении землёй и личной зависимости одних людей от других?", unit: "термин", answer: ["феодализм"] },
        { id: "q2", num: 2, text: "Как называли крупного землевладельца в средневековой Европе, который жаловал землю за службу?", unit: "слово", answer: ["феодал", "сеньор"] },
        { id: "q3", num: 3, text: "Как называли человека, который получал землю от сеньора и обязывался за это служить ему, в том числе в военных походах?", unit: "слово", answer: ["вассал"] },
        { id: "q4", num: 4, text: "Как называлось земельное владение, которое сеньор передавал вассалу за верную службу?", unit: "слово", answer: ["лен", "феод"] },
        { id: "q5", num: 5, text: "Как называется тип хозяйства, при котором всё необходимое производится внутри поместья и почти ничего не продаётся и не покупается?", unit: "термин", answer: ["натуральноехозяйство"] },
        { id: "q6", num: 6, text: "Как называется укреплённое каменное жилище феодала со рвом, башнями и подъёмным мостом?", unit: "слово", answer: ["замок"] },
      ]
    },
    {
      title: "Часть 2. Крестовые походы", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q7", num: 7, text: "Как называются военные походы западноевропейских рыцарей на Восток в XI–XIII веках, организованные под лозунгом освобождения христианских святынь?", unit: "термин", answer: ["крестовыепоходы"] },
        { id: "q8", num: 8, text: "Как называлось состязание рыцарей в силе и воинском мастерстве, проводившееся в мирное время?", unit: "слово", answer: ["турнир", "рыцарскийтурнир"] },
        { id: "q9", num: 9, text: "Какой город, священный для христиан, был главной целью Первого крестового похода и был взят в 1099 году?", unit: "название города", answer: ["иерусалим"] },
      ]
    },
    {
      title: "Часть 3. Древнерусское государство", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "Как называется древнерусское государство с центром в Киеве, сложившееся к концу IX века?", unit: "название", answer: ["русь", "киевскаярусь"] },
        { id: "q11", num: 11, text: "Как называется легендарное событие 862 года, когда, по преданию, ильменские словене пригласили на княжение варяжского князя Рюрика с братьями?", unit: "термин", answer: ["призваниеварягов"] },
        { id: "q12", num: 12, text: "Назовите киевскую княгиню, вдову князя Игоря, которая упорядочила сбор дани и первой из русских правителей приняла христианство.", unit: "имя", answer: ["ольга", "княгиняольга"] },
      ]
    },
    {
      title: "Часть 4. Раздробленность и монгольское нашествие", meta: "2 задания · 2 балла каждое",
      questions: [
        { id: "q13", num: 13, text: "Как называется период русской истории XII–XV веков, когда единое государство распалось на отдельные самостоятельные княжества?", unit: "термин", answer: ["раздробленность", "удельнаяраздробленность"] },
        { id: "q14", num: 14, text: "Как одним словом называлась ежегодная плата, которую русские княжества были обязаны вносить Золотой Орде после монгольского нашествия?", unit: "слово", answer: ["дань", "выход", "ордынскийвыход"] },
      ]
    },
    {
      title: "Часть 5. Практика: счёт лет", meta: "2 задания · 4 балла каждое",
      questions: [
        { id: "q15", num: 15, text: "Первый крестовый поход начался в 1096 году, а в 1099 году крестоносцы взяли Иерусалим. Сколько лет длился этот поход?", unit: "число лет", answer: 3 },
        { id: "q16", num: 16, text: "Монгольское нашествие на Русь началось в 1237 году, а ордынское иго было окончательно свергнуто в 1480 году. Сколько лет длилось иго?", unit: "число лет", answer: 243 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=2"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
