<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по истории — 10 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=3">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "history_10",
  subject: "История",
  grade: "10 класс",
  title: "Входной тест по истории",
  description: "Диагностика знаний за курс 9 класса для тех, кто перешёл в 10-й: реформы Александра II и отмена крепостного права, революционное движение, Первая мировая война, революции 1917 года.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Реформы Александра II", meta: "6 заданий · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "В каком году в России был издан манифест об отмене крепостного права?", unit: "год", answer: 1861 },
        { id: "q2", num: 2, text: "Как называется реформа 1864 года, учредившая выборные органы местного самоуправления в уездах и губерниях?", unit: "термин", answer: ["земскаяреформа", "земства"] },
        { id: "q3", num: 3, text: "Как называли бывших крепостных крестьян, которые после 1861 года ещё не выкупили землю и продолжали нести повинности в пользу помещика?", unit: "термин", answer: ["временнообязанные", "временнообязанныекрестьяне"] },
        { id: "q4", num: 4, text: "Как назывались ежегодные платежи, которые крестьяне вносили государству за землю, полученную при отмене крепостного права?", unit: "термин", answer: ["выкупныеплатежи", "выкуп"] },
        { id: "q5", num: 5, text: "Как называются представители общества, участвовавшие в судебном процессе по судебной реформе 1864 года и выносившие вердикт о виновности подсудимого?", unit: "термин", answer: ["присяжные", "присяжныезаседатели"] },
        { id: "q6", num: 6, text: "Назовите императора, при котором в России были проведены Великие реформы 1860–1870-х годов, включая отмену крепостного права.", unit: "имя", answer: ["александрii", "александр2", "александрвторой"] },
      ]
    },
    {
      title: "Часть 2. Революционное движение", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q7", num: 7, text: "Как называлась революционная народническая организация, устроившая охоту на императора Александра II и убившая его 1 марта 1881 года?", unit: "название", answer: ["народнаяволя"] },
        { id: "q8", num: 8, text: "Как называется метод политической борьбы, основанный на устрашении власти путём убийств и покушений, к которому прибегали народовольцы?", unit: "термин", answer: ["терроризм"] },
        { id: "q9", num: 9, text: "Назовите марксистскую партию, основанную в 1898 году, из которой позже выделились фракции большевиков и меньшевиков.", unit: "аббревиатура", answer: ["рсдрп"] },
      ]
    },
    {
      title: "Часть 3. Первая мировая война", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "В каком году началась Первая мировая война?", unit: "год", answer: 1914 },
        { id: "q11", num: 11, text: "Как назывался военно-политический блок России, Великобритании и Франции, противостоявший Германии и её союзникам в Первой мировой войне?", unit: "название", answer: ["антанта"] },
        { id: "q12", num: 12, text: "Убийство какого австрийского эрцгерцога в Сараево 28 июня 1914 года стало поводом к началу Первой мировой войны?", unit: "имя", answer: ["францфердинанд", "фердинанд"] },
      ]
    },
    {
      title: "Часть 4. От революции к новой эпохе", meta: "2 задания · 2 балла каждое",
      questions: [
        { id: "q13", num: 13, text: "Как называется революция в России в феврале 1917 года, приведшая к отречению Николая II и падению монархии?", unit: "название", answer: ["февральскаяреволюция"] },
        { id: "q14", num: 14, text: "Государство, образованное после революции 1917 года, впоследствии распалось. Назовите год распада СССР.", unit: "год", answer: 1991 },
      ]
    },
    {
      title: "Часть 5. Практика: счёт лет", meta: "2 задания · 4 балла каждое",
      questions: [
        { id: "q15", num: 15, text: "Первая мировая война началась в 1914 году и завершилась в 1918 году. Сколько лет она длилась?", unit: "число лет", answer: 4 },
        { id: "q16", num: 16, text: "Манифест об отмене крепостного права был издан в 1861 году, а Февральская революция произошла в 1917 году. Сколько лет разделяет эти события?", unit: "число лет", answer: 56 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=3"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
