<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по истории — 8 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=3">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "history_8",
  subject: "История",
  grade: "8 класс",
  title: "Входной тест по истории",
  description: "Диагностика знаний за курс 7 класса для тех, кто перешёл в 8-й: Великие географические открытия, Реформация в Европе, эпоха Ивана Грозного и опричнина, начало Смутного времени.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Великие географические открытия", meta: "4 задания · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Как называется период XV–XVII веков, когда европейские мореплаватели открыли новые морские пути в Индию, Америку и совершили первое кругосветное плавание?", unit: "термин", answer: ["географическиеоткрытия", "великиегеографическиеоткрытия"] },
        { id: "q2", num: 2, text: "Назовите мореплавателя, который в 1492 году, стремясь найти морской путь в Индию, открыл для европейцев Америку.", unit: "имя", answer: ["колумб"] },
        { id: "q3", num: 3, text: "Назовите руководителя первой в мире кругосветной экспедиции (1519–1522), доказавшей, что Земля имеет форму шара.", unit: "имя", answer: ["магеллан"] },
        { id: "q4", num: 4, text: "Как называется резкий рост цен в Европе XVI века, вызванный притоком дешёвого золота и серебра из американских колоний?", unit: "термин", answer: ["революцияцен"] },
      ]
    },
    {
      title: "Часть 2. Реформация в Европе", meta: "2 задания · 2 балла каждое",
      questions: [
        { id: "q5", num: 5, text: "Как называется движение за обновление христианской церкви, начавшееся в Германии в 1517 году и приведшее к возникновению протестантизма?", unit: "термин", answer: ["реформация"] },
        { id: "q6", num: 6, text: "Назовите немецкого монаха и богослова, который в 1517 году выступил против продажи индульгенций и положил начало этому движению.", unit: "имя", answer: ["лютер"] },
      ]
    },
    {
      title: "Часть 3. Эпоха Ивана Грозного", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q7", num: 7, text: "Какой титул принял Иван IV в 1547 году, венчавшись на царство в Успенском соборе Московского Кремля?", unit: "слово", answer: ["царь"] },
        { id: "q8", num: 8, text: "Как называется система чрезвычайных мер Ивана Грозного (1565–1572), включавшая раздел страны на две части и репрессии против боярства?", unit: "термин", answer: ["опричнина"] },
        { id: "q9", num: 9, text: "Как называется сословно-представительное собрание в России XVI–XVII веков, впервые созванное Иваном IV в 1549 году?", unit: "название", answer: ["земскийсобор"] },
      ]
    },
    {
      title: "Часть 4. Смутное время", meta: "2 задания · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "Как называется период глубокого политического и экономического кризиса в России конца XVI — начала XVII века, начавшийся после пресечения династии Рюриковичей?", unit: "термин", answer: ["смута", "смутноевремя"] },
        { id: "q11", num: 11, text: "Как называли людей, выдававших себя за чудом спасшегося царевича Дмитрия в годы Смуты (например, Лжедмитрий I)?", unit: "термин", answer: ["самозванцы", "самозванец"] },
      ]
    },
    {
      title: "Часть 5. Объединение и управление Русским государством", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q12", num: 12, text: "Как называется процесс усиления великокняжеской власти и превращения Москвы в единый политический центр русских земель, завершившийся к началу XVI века?", unit: "термин", answer: ["централизация", "объединениерусскихземель"] },
        { id: "q13", num: 13, text: "Как называется свод законов единого Русского государства, принятый Иваном III в 1497 году?", unit: "название документа", answer: ["судебник"] },
        { id: "q14", num: 14, text: "Как называли представителя высшего слоя феодальной знати в Русском государстве, члена Боярской думы?", unit: "слово", answer: ["боярин"] },
      ]
    },
    {
      title: "Часть 6. Практика: счёт лет", meta: "2 задания · 3 балла каждое",
      questions: [
        { id: "q15", num: 15, text: "Иван IV принял царский титул в 1547 году, а опричнина была введена в 1565 году. Сколько лет прошло между этими событиями?", unit: "число лет", answer: 18 },
        { id: "q16", num: 16, text: "Христофор Колумб открыл Америку в 1492 году, а Мартин Лютер начал Реформацию в 1517 году. Сколько лет разделяет эти события?", unit: "число лет", answer: 25 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=3"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
