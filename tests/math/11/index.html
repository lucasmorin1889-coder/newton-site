<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по математике — 11 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=2">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+7 9XX XXX-XX-XX">
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "math_11",
  subject: "Математика",
  grade: "11 класс",
  title: "Входной тест по математике",
  description: "Диагностика знаний за курс 10 класса для тех, кто перешёл в 11-й: тригонометрия, степени, логарифмы, стереометрия.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Тригонометрия", meta: "12 баллов",
      questions: [
        { id: "q1", num: 1, text: "Вычислите: sin 30°", unit: "число", answer: 0.5 },
        { id: "q2", num: 2, text: "Вычислите: cos 60°", unit: "число", answer: 0.5 },
        { id: "q3", num: 3, text: "Вычислите: tg 45°", unit: "число", answer: 1 },
        { id: "q4", num: 4, text: "Чему равно значение выражения sin²α + cos²α при любом угле α?", unit: "число", answer: 1 },
        { id: "q5", num: 5, text: "Решите уравнение tg α = √3 (0° < α < 90°). Найдите α.", unit: "°", answer: 60 },
        { id: "q6", num: 6, text: "Дано: sin α = 0,6, cos α = 0,8 (α — острый угол). Найдите sin 2α.", unit: "число", answer: 0.96 },
      ]
    },
    {
      title: "Часть 2. Степени, логарифмы и алгебра", meta: "8 баллов",
      questions: [
        { id: "q7", num: 7, text: "Вычислите: log₂ 16", unit: "число", answer: 4 },
        { id: "q9", num: 9, text: "Раскройте скобки: (2x − 5)²", unit: "выражение", answer: "4x² − 20x + 25" },
        { id: "q10a", num: 10.1, text: "Решите уравнение: x² − 7x + 12 = 0. Найдите больший из двух корней.", unit: "x = ?", answer: 4 },
        { id: "q10b", num: 10.2, text: "Решите то же уравнение x² − 7x + 12 = 0. Найдите меньший из двух корней.", unit: "x = ?", answer: 3 },
        { id: "q11a", num: 11.1, text: "Решите уравнение: x² − 5x + 6 = 0. Найдите больший из двух корней.", unit: "x = ?", answer: 3 },
        { id: "q11b", num: 11.2, text: "Решите то же уравнение x² − 5x + 6 = 0. Найдите меньший из двух корней.", unit: "x = ?", answer: 2 },
      ]
    },
    {
      title: "Часть 3. Геометрия и стереометрия", meta: "10 баллов",
      questions: [
        { id: "q12", num: 12, text: "Найдите величину внешнего угла правильного шестиугольника.", unit: "°", answer: 60 },
        { id: "q13", num: 13, text: "Ребро куба равно 6 см. Найдите объём куба.", unit: "см³", answer: 216 },
        { id: "q14", num: 14, text: "Стороны прямоугольника равны 3,46 м и 2 м. Найдите площадь прямоугольника.", unit: "м²", answer: 6.92 },
        { id: "q15", num: 15, text: "Измерения прямоугольного параллелепипеда равны 3 см, 4 см и 12 см. Найдите его диагональ.", unit: "см", answer: 13 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=2"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
