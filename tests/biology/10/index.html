<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по биологии — 10 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+7 9XX XXX-XX-XX">
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "biology_10",
  subject: "Биология",
  grade: "10 класс",
  title: "Входной тест по биологии",
  description: "Диагностика знаний за курс 9 класса для тех, кто перешёл в 10-й: клетка углублённо, основы генетики, эволюционное учение, основы экологии.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Клеточные органоиды", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Какой органоид клетки называют «энергетической станцией», так как в нём происходит клеточное дыхание и синтезируется большая часть АТФ?", unit: "органоид", answer: ["митохондрия", "митохондрии"] },
        { id: "q2", num: 2, text: "На каком органоиде клетки происходит синтез белка — сборка полипептидной цепи из аминокислот по матрице иРНК?", unit: "органоид", answer: ["рибосома", "рибосомы"] },
        { id: "q3", num: 3, text: "Какой органоид клетки представляет собой систему мембранных каналов и полостей, пронизывающих цитоплазму, и участвует во внутриклеточном транспорте веществ?", unit: "органоид", answer: ["эндоплазматическаясеть", "эпс"] },
      ]
    },
    {
      title: "Часть 2. Обмен веществ в клетке", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q4", num: 4, text: "Как называется совокупность реакций синтеза сложных органических веществ из более простых с затратой энергии, например фотосинтез или синтез белка?", unit: "вид обмена веществ", answer: ["пластическийобмен", "ассимиляция"] },
        { id: "q5", num: 5, text: "Как называется совокупность реакций расщепления сложных органических веществ до более простых с высвобождением энергии, запасаемой в АТФ?", unit: "вид обмена веществ", answer: ["энергетическийобмен", "диссимиляция"] },
        { id: "q6", num: 6, text: "Как называется самопроизвольное перемещение молекул вещества, например кислорода из крови в клетку, из области большей концентрации в область меньшей концентрации без затрат энергии клеткой?", unit: "процесс", answer: ["диффузия"] },
      ]
    },
    {
      title: "Часть 3. Основы генетики", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q7", num: 7, text: "В опытах Менделя при скрещивании растений гороха с жёлтыми и зелёными семенами всё потомство первого поколения оказалось с жёлтыми семенами. Как называют такой преобладающий, проявляющийся признак?", unit: "признак", answer: ["доминантный"] },
        { id: "q8", num: 8, text: "Признак, который не проявился у гибрида первого поколения, но вновь появляется в следующих поколениях (как зелёная окраска семян гороха в опытах Менделя), называют...", unit: "признак", answer: ["рецессивный"] },
        { id: "q9", num: 9, text: "Как называется совокупность всех генов организма — вся его наследственная информация, записанная в ДНК?", unit: "понятие", answer: ["генотип"] },
      ]
    },
    {
      title: "Часть 4. Эволюционное учение", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q10", num: 10, text: "Чарльз Дарвин назвал так процесс, при котором в природе выживают и оставляют потомство преимущественно особи с полезными в данных условиях признаками. Назовите этот процесс.", unit: "процесс", answer: ["естественныйотбор"] },
        { id: "q11", num: 11, text: "Дарвин отмечал, что особи одного вида конкурируют друг с другом и с другими видами за пищу, территорию и другие ресурсы, необходимые для выживания. Как он назвал это явление?", unit: "понятие", answer: ["борьбазасуществование"] },
        { id: "q12", num: 12, text: "Белая окраска шерсти зайца-беляка зимой, делающая его незаметным на снегу — пример чего по отношению к условиям среды?", unit: "понятие", answer: ["приспособленность", "адаптация"] },
      ]
    },
    {
      title: "Часть 5. Основы экологии", meta: "2 задания · 1 балл каждое",
      questions: [
        { id: "q13", num: 13, text: "Как называется совокупность живых организмов разных видов и неживой среды — почвы, воды, воздуха, — связанных обменом веществ и энергии, например лес или озеро?", unit: "понятие", answer: ["экосистема"] },
        { id: "q14", num: 14, text: "Трава → кузнечик → лягушка → уж → сокол. Как называется такая последовательность организмов, каждый из которых служит пищей следующему?", unit: "понятие", answer: ["цепьпитания"] },
      ]
    },
    {
      title: "Часть 6. Числа в генетике", meta: "2 задания · 8 баллов каждое",
      questions: [
        { id: "q15", num: 15, text: "Фермер скрестил чистые линии гороха с жёлтыми и зелёными семенами. Во втором поколении (F2) наблюдается расщепление 3:1 — на каждые 3 растения с жёлтыми семенами приходится 1 растение с зелёными. Если всего в F2 выросло 2000 растений, сколько из них имеют зелёные семена?", unit: "растений", answer: 500 },
        { id: "q16", num: 16, text: "В той же выборке из 2000 растений гороха F2 при расщеплении 3:1 растения с жёлтыми семенами составляют определённую долю от общего числа. Сколько это процентов?", unit: "%", answer: 75 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
