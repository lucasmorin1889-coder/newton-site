<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по биологии — 5 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=2">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+7 9XX XXX-XX-XX">
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "biology_5",
  subject: "Биология",
  grade: "5 класс",
  title: "Входной тест по биологии",
  description: "Проверка готовности к старту биологии в 5 классе: признаки живого, части растения, группы животных, органы чувств.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Признаки живого организма", meta: "6 заданий · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Живые организмы поглощают кислород и выделяют углекислый газ. Какой признак живого организма здесь проявляется?", unit: "признак живого", answer: ["дыхание"] },
        { id: "q2", num: 2, text: "Из маленького жёлудя за десятки лет вырастает могучий дуб высотой более 20 метров. Какой признак живого организма здесь проявляется?", unit: "признак живого", answer: ["рост"] },
        { id: "q3", num: 3, text: "Кошка рождает котят, которые, повзрослев, сами дают потомство. Какой признак живого организма здесь проявляется?", unit: "признак живого", answer: ["размножение"] },
        { id: "q4", num: 4, text: "Гусеница день за днём поедает листья капусты, получая из них вещества и энергию для жизни. Какой признак живого организма здесь проявляется?", unit: "признак живого", answer: ["питание"] },
        { id: "q5", num: 5, text: "Мимоза стыдливая быстро складывает листья, если до неё дотронуться. Какой признак живого организма она демонстрирует?", unit: "признак живого", answer: ["раздражимость"] },
        { id: "q6", num: 6, text: "Организм постоянно удаляет из себя ненужные и вредные вещества, например с потом и мочой. Как называется этот признак живого?", unit: "признак живого", answer: ["выделение"] },
      ]
    },
    {
      title: "Часть 2. Части растения", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q7", num: 7, text: "Какой орган растения обычно находится в почве, закрепляет растение и всасывает воду с растворёнными минеральными солями?", unit: "орган растения", answer: ["корень"] },
        { id: "q8", num: 8, text: "Какая часть побега — широкая, плоская и обычно зелёная — улавливает солнечный свет и служит растению для дыхания и испарения воды?", unit: "орган растения", answer: ["лист"] },
        { id: "q9", num: 9, text: "После того как цветок отцветает и происходит опыление, на его месте образуется этот орган, внутри которого созревают семена. Назовите его.", unit: "орган растения", answer: ["плод"] },
      ]
    },
    {
      title: "Часть 3. Группы животных", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q10", num: 10, text: "Тело этих животных покрыто перьями, передние конечности превращены в крылья, а большинство видов строит гнёзда и откладывает яйца. Назовите группу.", unit: "группа животных", answer: ["птицы", "птица"] },
        { id: "q11", num: 11, text: "Эти животные живут в воде, дышат жабрами и передвигаются с помощью плавников. Назовите группу.", unit: "группа животных", answer: ["рыбы", "рыба"] },
        { id: "q12", num: 12, text: "У этих животных шесть ног, тело разделено на голову, грудь и брюшко, а у многих есть крылья. Назовите группу.", unit: "группа животных", answer: ["насекомые", "насекомое"] },
      ]
    },
    {
      title: "Часть 4. Органы чувств", meta: "2 задания · 1 балл каждое",
      questions: [
        { id: "q13", num: 13, text: "Какой орган позволяет нам различать вкус пищи — сладкое, солёное, кислое и горькое?", unit: "орган чувств", answer: ["язык"] },
        { id: "q14", num: 14, text: "Какой орган помогает нам слышать звуки и удерживать равновесие тела?", unit: "орган чувств", answer: ["ухо", "уши"] },
      ]
    },
    {
      title: "Часть 5. Числа в природе", meta: "2 задания · 8 баллов каждое",
      questions: [
        { id: "q15", num: 15, text: "У котёнка временных (молочных) зубов всего 26. А сколько постоянных зубов вырастает у взрослой домашней кошки?", unit: "зубов", answer: 30 },
        { id: "q16", num: 16, text: "В школьном живом уголке 4 клетки, и в каждой сидит по 2 волнистых попугайчика, а ещё 3 попугайчика летают отдельно в общем вольере. Сколько всего попугайчиков в живом уголке?", unit: "попугаев", answer: 11 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=2"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
