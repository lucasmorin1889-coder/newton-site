<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по биологии — 6 класс — Ньютон</title>
<meta name="description" content="Диагностика знаний за курс 5 класса для тех, кто перешёл в 6-й: методы изучения природы, царства живой природы, клетка, увеличительные приборы. Бесплатный онлайн-тест от образовательного центра Ньютон, Петрозаводск.">
<link rel="canonical" href="https://newton-petrozavodsk.ru/tests/biology/6/">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=4">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "biology_6",
  subject: "Биология",
  grade: "6 класс",
  title: "Входной тест по биологии",
  description: "Диагностика знаний за курс 5 класса для тех, кто перешёл в 6-й: методы изучения природы, царства живой природы, клетка, увеличительные приборы.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Наука о живой природе и методы её изучения", meta: "4 задания · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Учёный специально помещает семена в разные условия освещения, чтобы проверить, как свет влияет на их прорастание. Какой метод изучения природы он применяет?", unit: "метод", answer: ["эксперимент", "опыт"] },
        { id: "q2", num: 2, text: "Натуралист много часов сидит в укрытии с биноклем и просто фиксирует поведение животных, не вмешиваясь в их жизнь. Какой это метод изучения природы?", unit: "метод", answer: ["наблюдение"] },
        { id: "q3", num: 3, text: "Чтобы точно узнать рост, массу тела или температуру животного, учёный использует линейку, весы или термометр. Как называется такой метод изучения природы?", unit: "метод", answer: ["измерение"] },
        { id: "q4", num: 4, text: "Как называется наука, изучающая живые организмы — их строение, жизнедеятельность и многообразие?", unit: "наука", answer: ["биология"] },
      ]
    },
    {
      title: "Часть 2. Увеличительные приборы", meta: "2 задания · 1 балл каждое",
      questions: [
        { id: "q5", num: 5, text: "Какой простой ручной увеличительный прибор даёт увеличение всего в несколько раз и обычно есть у каждого юного натуралиста?", unit: "прибор", answer: ["лупа"] },
        { id: "q6", num: 6, text: "Какой прибор со сложной системой линз позволяет рассмотреть клетки растений и животных, давая увеличение в сотни раз?", unit: "прибор", answer: ["микроскоп"] },
      ]
    },
    {
      title: "Часть 3. Царства живой природы", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q7", num: 7, text: "Это царство живой природы объединяет одноклеточные организмы без оформленного ядра — самые древние и многочисленные обитатели Земли. Назовите царство.", unit: "царство", answer: ["бактерии"] },
        { id: "q8", num: 8, text: "Организмы этого царства неподвижны, имеют клеточную стенку и способны к фотосинтезу, создавая органические вещества на свету. Назовите царство.", unit: "царство", answer: ["растения"] },
        { id: "q9", num: 9, text: "Организмы этого царства не способны к фотосинтезу, но, как и растения, имеют клеточную стенку; питаются, всасывая готовые органические вещества из окружающей среды. Назовите царство.", unit: "царство", answer: ["грибы"] },
      ]
    },
    {
      title: "Часть 4. Строение клетки", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q10", num: 10, text: "Какая тонкая плёнка окружает содержимое клетки и регулирует, какие вещества входят внутрь клетки, а какие выходят из неё?", unit: "часть клетки", answer: ["мембрана", "клеточнаямембрана"] },
        { id: "q11", num: 11, text: "У растительной клетки, помимо тонкой мембраны, есть ещё и плотная наружная часть из клетчатки, придающая клетке прочную форму. Как она называется?", unit: "часть клетки", answer: ["оболочка", "клеточнаяоболочка", "клеточнаястенка"] },
        { id: "q12", num: 12, text: "Какая часть клетки хранит наследственную информацию и управляет всеми процессами, происходящими в клетке?", unit: "часть клетки", answer: ["ядро"] },
      ]
    },
    {
      title: "Часть 5. Среды обитания", meta: "2 задания · 1 балл каждое",
      questions: [
        { id: "q13", num: 13, text: "Как называется совокупность условий — свет, вода, температура, другие организмы, — в которых обитает живой организм?", unit: "понятие", answer: ["средаобитания", "среда"] },
        { id: "q14", num: 14, text: "Дождевой червь живёт в почвенной среде, рыба — в водной, а воробей, заяц и дуб обитают в какой среде?", unit: "среда обитания", answer: ["наземновоздушная", "наземновоздушнаясреда"] },
      ]
    },
    {
      title: "Часть 6. Числа в природе", meta: "2 задания · 8 баллов каждое",
      questions: [
        { id: "q15", num: 15, text: "Лаборант рассматривает препарат под микроскопом при увеличении окуляра в 5 раз и объектива в 3 раза. Во сколько раз микроскоп увеличивает изображение в этом случае (увеличение окуляра умножается на увеличение объектива)?", unit: "раз", answer: 15 },
        { id: "q16", num: 16, text: "Учитель разложил на предметных стёклах для изучения под микроскопом лист элодеи, перо птицы, чешую рыбы, волос человека и каплю воды из лужи. Сколько образцов приготовил учитель?", unit: "образцов", answer: 5 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=4"></script>
