<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по биологии — 8 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=3">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "biology_8",
  subject: "Биология",
  grade: "8 класс",
  title: "Входной тест по биологии",
  description: "Диагностика знаний за курс 7 класса для тех, кто перешёл в 8-й: систематика животных, значение животных, дыхание и питание разных групп.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Типы животных и линька", meta: "6 заданий · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Одноклеточные животные, такие как амёба и инфузория-туфелька, состоящие всего из одной клетки, относятся к этой группе. Назовите её.", unit: "группа животных", answer: ["простейшие"] },
        { id: "q2", num: 2, text: "Гидра, медузы и кораллы — представители группы с лучевой симметрией тела и стрекательными клетками. Назовите эту группу.", unit: "группа животных", answer: ["кишечнополостные"] },
        { id: "q3", num: 3, text: "Улитка, беззубка и осьминог — представители группы, у большинства видов которой мягкое тело и есть раковина. Назовите эту группу.", unit: "группа животных", answer: ["моллюски"] },
        { id: "q4", num: 4, text: "Рак, паук и бабочка относятся к группе животных с членистыми конечностями и телом, покрытым твёрдым наружным скелетом. Назовите эту группу.", unit: "группа животных", answer: ["членистоногие"] },
        { id: "q5", num: 5, text: "Рыбы, лягушки, ящерицы, птицы и звери относятся к крупной группе животных, у которых на определённом этапе развития есть внутренний осевой скелет. Назовите эту группу.", unit: "группа животных", answer: ["хордовые"] },
        { id: "q6", num: 6, text: "У рака или бабочки твёрдый наружный скелет не растягивается вместе с телом, поэтому животное периодически сбрасывает старый покров и наращивает новый. Как называется этот процесс?", unit: "процесс", answer: ["линька"] },
      ]
    },
    {
      title: "Часть 2. Типы червей", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q7", num: 7, text: "Тело животных этого типа (например, планарии) сплющено в спинно-брюшном направлении. Назовите тип червей.", unit: "тип червей", answer: ["плоскиечерви"] },
        { id: "q8", num: 8, text: "Тело животных этого типа (например, аскариды) имеет цилиндрическую, круглую в поперечном сечении форму и заострено на концах. Назовите тип червей.", unit: "тип червей", answer: ["круглыечерви"] },
        { id: "q9", num: 9, text: "Тело дождевого червя разделено на множество одинаковых повторяющихся члеников-колец. Назовите тип червей.", unit: "тип червей", answer: ["кольчатыечерви"] },
      ]
    },
    {
      title: "Часть 3. Дыхание животных", meta: "3 задания · 1 балл каждое",
      questions: [
        { id: "q10", num: 10, text: "Каким органом дышит большинство рыб, извлекая растворённый в воде кислород?", unit: "орган дыхания", answer: ["жабры"] },
        { id: "q11", num: 11, text: "Дождевой червь не имеет ни лёгких, ни жабр — каким органом он дышит, поглощая кислород через влажную поверхность тела?", unit: "орган дыхания", answer: ["кожа"] },
        { id: "q12", num: 12, text: "Насекомые дышат не лёгкими, а системой ветвящихся воздухоносных трубочек, открывающихся наружу дыхальцами. Как называются эти трубочки?", unit: "орган дыхания", answer: ["трахеи"] },
      ]
    },
    {
      title: "Часть 4. Питание животных", meta: "2 задания · 1 балл каждое",
      questions: [
        { id: "q13", num: 13, text: "Как называют животных, например зайца, корову или гусеницу, которые питаются только растительной пищей?", unit: "группа по питанию", answer: ["растительноядные", "травоядные"] },
        { id: "q14", num: 14, text: "Как называют животных, например волка или щуку, которые питаются другими животными, добывая и поедая их?", unit: "группа по питанию", answer: ["хищники", "плотоядные"] },
      ]
    },
    {
      title: "Часть 5. Числа в мире животных", meta: "2 задания · 8 баллов каждое",
      questions: [
        { id: "q15", num: 15, text: "В школьный кабинет биологии купили 6 аквариумов и поместили в каждый по 100 мальков гуппи для наблюдения за их развитием. Сколько всего мальков поместили в кабинете?", unit: "мальков", answer: 600 },
        { id: "q16", num: 16, text: "У большинства брюхоногих моллюсков, например у виноградной улитки, сердце состоит из предсердия и желудочка. Сколько камер в таком сердце?", unit: "камеры", answer: 2 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=3"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
