<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по химии — 9 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=3">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "chemistry_9",
  subject: "Химия",
  grade: "9 класс",
  title: "Входной тест по химии",
  description: "Диагностика знаний за курс 8 класса для тех, кто перешёл в 9-й: строение вещества, классы соединений, типы реакций, расчёты.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Строение атома, валентность и формулы веществ", meta: "6 заданий · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Порядковый номер аргона Ar в периодической системе — 18. Сколько протонов содержится в ядре его атома?", unit: "протонов", answer: 18 },
        { id: "q2", num: 2, text: "Вычислите молярную массу углекислого газа CO2 (Ar(C)=12, Ar(O)=16).", unit: "г/моль", answer: 44 },
        { id: "q3", num: 3, text: "Магний находится во II группе периодической системы. Сколько электронов на внешнем энергетическом уровне у атома магния?", unit: "электронов", answer: 2 },
        { id: "q4", num: 4, text: "Определите валентность серы в оксиде SO3, зная, что валентность кислорода равна II. Запишите ответ римской цифрой.", unit: "римская цифра", answer: ["vi", "VI"] },
        { id: "q5", num: 5, text: "Составьте формулу оксида алюминия, если валентность алюминия III, а кислорода II.", unit: "формула", answer: ["al2o3"] },
        { id: "q6", num: 6, text: "Какова валентность кислорода в подавляющем большинстве его соединений (оксидах)? Запишите число.", unit: "число", answer: 2 },
      ]
    },
    {
      title: "Часть 2. Классы неорганических соединений", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q7", num: 7, text: "К какому классу неорганических соединений относится вещество CaO?", unit: "класс соединений", answer: ["оксид"] },
        { id: "q8", num: 8, text: "К какому классу неорганических соединений относится вещество H2SO4?", unit: "класс соединений", answer: ["кислота"] },
        { id: "q9", num: 9, text: "К какому классу неорганических соединений относится вещество NaOH?", unit: "класс соединений", answer: ["основание"] },
      ]
    },
    {
      title: "Часть 3. Типы химических реакций", meta: "3 задания · 2 балла каждое",
      questions: [
        { id: "q10", num: 10, text: "Определите тип реакции: 2Na + Cl2 → 2NaCl", unit: "тип реакции", answer: ["соединения"] },
        { id: "q11", num: 11, text: "Определите тип реакции: 2H2O2 → 2H2O + O2↑", unit: "тип реакции", answer: ["разложения"] },
        { id: "q12", num: 12, text: "Определите тип реакции: Zn + 2HCl → ZnCl2 + H2↑", unit: "тип реакции", answer: ["замещения"] },
      ]
    },
    {
      title: "Часть 4. Расчёты", meta: "4 задания · 3 балла каждое",
      questions: [
        { id: "q13", num: 13, text: "Молярная масса водорода H2 равна 2 г/моль. Сколько моль вещества содержится в образце водорода массой 14 г?", unit: "моль", answer: 7 },
        { id: "q14", num: 14, text: "Зная, что валентность кислорода равна II, определите валентность углерода в оксиде CO2. Запишите ответ числом (не римской цифрой).", unit: "число", answer: 4 },
        { id: "q15", num: 15, text: "Вычислите молярную массу гидроксида натрия NaOH (Ar(Na)=23, Ar(O)=16, Ar(H)=1).", unit: "г/моль", answer: 40 },
        { id: "q16", num: 16, text: "Сколько граммов оксида углерода(IV) CO2 (M=44 г/моль) образуется из 0,5 моль этого вещества?", unit: "г", answer: 22 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=3"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
