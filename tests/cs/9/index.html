<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по информатике — 9 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=3">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "cs_9",
  subject: "Информатика",
  grade: "9 класс",
  title: "Входной тест по информатике",
  description: "Диагностика знаний за курс 8 класса для тех, кто перешёл в 9-й: системы счисления, логика, алгоритмы, программирование.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Системы счисления", meta: "4 задания · 1 балл каждое",
      questions: [
        { id: "q1", num: 1, text: "Переведите число 12 из десятичной системы счисления в двоичную.", unit: "двоичное число", answer: "1100" },
        { id: "q2", num: 2, text: "Переведите число 1111 из двоичной системы счисления в десятичную.", unit: "число", answer: 15 },
        { id: "q3", num: 3, text: "Утверждение: «Число 1100 в двоичной системе счисления соответствует нечётному числу в десятичной записи». Это утверждение истинно или ложно?", unit: "истинно/ложно", answer: ["ложно"] },
        { id: "q4", num: 4, text: "Переведите число 1011 из двоичной системы счисления в десятичную.", unit: "число", answer: 11 },
      ]
    },
    {
      title: "Часть 2. Типы данных и операции", meta: "2 задания · 1 балл каждое",
      questions: [
        { id: "q5", num: 5, text: "Какой тип данных используется для чисел с дробной частью, например 3.14?", unit: "тип данных", answer: ["вещественный", "float"] },
        { id: "q6", num: 6, text: "Чему равен остаток от деления 17 на 5?", unit: "число", answer: 2 },
      ]
    },
    {
      title: "Часть 3. Алгоритмы", meta: "6 баллов",
      questions: [
        { id: "q7", num: 7, text: "Как называется алгоритм, в котором команды выполняются одна за другой, без ветвлений и повторений?", unit: "термин", answer: ["линейный"] },
        { id: "q8", num: 8, text: "Как называется алгоритм, в котором группа команд повторяется несколько раз?", unit: "термин", answer: ["циклический"] },
        { id: "q9", num: 9, text: "Как называется способ записи алгоритма с помощью связанных стрелками блоков разной формы?", unit: "термин", answer: ["блок-схема"] },
      ]
    },
    {
      title: "Часть 4. Основы программирования", meta: "10 баллов",
      questions: [
        { id: "q10", num: 10, text: "Какой знак используется в программировании для присваивания значения переменной, например x = 5?", unit: "знак/слово", answer: ["=", "присваивание"] },
        { id: "q11", num: 11, text: "Дан фрагмент программы: x = 1; x = x + 2. Чему будет равно значение переменной x после выполнения?", unit: "число", answer: 3 },
        { id: "q12", num: 12, text: "Как называется ошибка в программе, при которой нарушены правила записи команд языка программирования (например, пропущена скобка)?", unit: "термин", answer: ["синтаксическая ошибка"] },
        { id: "q13", num: 13, text: "Какой тип данных используется для хранения текста, например «Привет»?", unit: "тип данных", answer: ["строковый"] },
        { id: "q14", num: 14, text: "Дан фрагмент программы: y = 10; y = y - 9. Чему будет равно значение переменной y после выполнения?", unit: "число", answer: 1 },
      ]
    },
    {
      title: "Часть 5. Задачи на алгоритмы", meta: "8 баллов",
      questions: [
        { id: "q15", num: 15, text: "В цикле значение переменной x, равное 1, удваивается 4 раза подряд (1→2→4→8→16). Чему будет равно x после четырёх удвоений?", unit: "число", answer: 16 },
        { id: "q16", num: 16, text: "Сколько раз выполнится тело цикла, если переменная i принимает по порядку значения от 1 до 5 включительно?", unit: "число", answer: 5 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=3"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
