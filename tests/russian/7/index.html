<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по русскому языку — 7 класс — Ньютон</title>
<meta name="description" content="Диагностика знаний за начальную школу, 5 и 6 класс для тех, кто перешёл в 7-й: орфограммы, числительное, местоимение, причастие, деепричастие. Бесплатный онлайн-тест от образовательного центра Ньютон, Петрозаводск.">
<link rel="canonical" href="https://newton-petrozavodsk.ru/tests/russian/7/">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=4">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "russian_7",
  subject: "Русский язык",
  grade: "7 класс",
  title: "Входной тест по русскому языку",
  description: "Диагностика знаний за начальную школу, 5 и 6 класс для тех, кто перешёл в 7-й: орфограммы, числительное, местоимение, причастие, деепричастие.",
  duration_min: 35,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Орфограммы (повторение)", meta: "6 заданий · 8 баллов",
      questions: [
        { id: "q1", num: 1, text: "Вставьте пропущенную букву в неизменяемой приставке: ...делать домашнее задание", unit: "буква", answer: ["с"] },
        { id: "q2", num: 2, text: "Вставьте пропущенную букву: жаре...ый картофель (без приставки и зависимых слов)", unit: "буква", answer: ["н"] },
        { id: "q3", num: 3, text: "Вставьте букву в приставке со значением неполноты действия: пр...открыть окно", unit: "буква", answer: ["и"] },
        { id: "q4", num: 4, text: "Как пишется «не» с деепричастием в предложении «Он уходил, не оглядываясь.» — слитно или раздельно?", unit: "слитно/раздельно", answer: ["раздельно"] },
        { id: "q5", num: 5, text: "Поставьте числительное «пять» в творительный падеж.", unit: "слово", answer: ["пятью"] },
        { id: "q6", num: 6, text: "Вставьте букву в суффиксе после шипящей под ударением: снеж...к", unit: "буква", answer: ["о"] },
      ]
    },
    {
      title: "Часть 2. Местоимение, числительное, причастие, деепричастие", meta: "5 заданий · 10 баллов",
      questions: [
        { id: "q7", num: 7, text: "Определите разряд местоимения «никто» в предложении: «Никто не пришёл вовремя.»", unit: "разряд", answer: ["отрицательное"] },
        { id: "q8", num: 8, text: "Определите разряд числительного «трое» в словосочетании «трое друзей».", unit: "разряд", answer: ["собирательное"] },
        { id: "q9", num: 9, text: "Определите часть речи слова «который» в предложении: «Дом, который стоит на берегу Онего, недавно построили.»", unit: "часть речи", answer: ["местоимение"] },
        { id: "q10", num: 10, text: "Образуйте от глагола «читать» действительное причастие настоящего времени.", unit: "слово", answer: ["читающий"] },
        { id: "q11", num: 11, text: "Образуйте от глагола «уходить» деепричастие несовершенного вида.", unit: "слово", answer: ["уходя"] },
      ]
    },
    {
      title: "Часть 3. Наречие и лексика", meta: "2 задания · 4 балла",
      questions: [
        { id: "q12", num: 12, text: "Определите разряд наречия «очень» в словосочетании «очень интересный рассказ».", unit: "разряд", answer: ["меры и степени", "степени", "меры"] },
        { id: "q13", num: 13, text: "Подберите синоним к наречию «неаккуратно».", unit: "слово", answer: ["небрежно", "плохо", "кое-как"] },
      ]
    },
    {
      title: "Часть 4. Лексика, словообразование, синтаксис", meta: "3 задания · 8 баллов",
      questions: [
        { id: "q14", num: 14, text: "Подберите антоним к слову «трудолюбивый».", unit: "слово", answer: ["ленивый"] },
        { id: "q15", num: 15, text: "От глагола «учить» образуйте с помощью суффикса -тель существительное со значением «тот, кто это делает».", unit: "слово", answer: ["учитель"] },
        { id: "q16", num: 16, text: "Сколько местоимений в предложении: «Она позвонила ему вчера.»?", unit: "число", answer: 2 },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=4"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
