<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по русскому языку — 9 класс — Ньютон</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=3">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "russian_9",
  subject: "Русский язык",
  grade: "9 класс",
  title: "Входной тест по русскому языку",
  description: "Диагностика знаний за начальную школу и с 5 по 8 класс для тех, кто перешёл в 9-й: сложные предложения, синтаксический разбор, стили речи.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Орфограммы", meta: "6 заданий · 8 баллов",
      questions: [
        { id: "q1", num: 1, text: "Вставьте букву в приставке перед глухим согласным: и...чезнуть", unit: "буква", answer: ["с"] },
        { id: "q2", num: 2, text: "Вставьте буквы в суффиксе -ованн-: организ...ая экскурсия", unit: "буквы", answer: ["нн"] },
        { id: "q3", num: 3, text: "Сколько запятых нужно поставить в предложении: «Когда наступила осень туристы покинули остров Кижи»?", unit: "число", answer: 1 },
        { id: "q4", num: 4, text: "Какой знак препинания нужно поставить на месте пропуска в бессоюзном сложном предложении со значением противопоставления: «Труд человека кормит ... лень портит.»?", unit: "знак препинания", answer: ["тире"] },
        { id: "q5", num: 5, text: "Как пишется союз «чтобы» в предложении «Я пришёл, чтобы помочь.» — слитно или раздельно?", unit: "слитно/раздельно", answer: ["слитно"] },
        { id: "q6", num: 6, text: "Как пишется «тоже» в значении «и я» в предложении «Друзья ушли, я тоже решил уйти.» — слитно или раздельно?", unit: "слитно/раздельно", answer: ["слитно"] },
      ]
    },
    {
      title: "Часть 2. Сложное предложение", meta: "4 задания · 8 баллов",
      questions: [
        { id: "q7", num: 7, text: "Определите тип предложения по строению: «Ветер стих, и на озере наступила тишина.»", unit: "тип предложения", answer: ["сложносочинённое", "сложносочиненное"] },
        { id: "q8", num: 8, text: "Определите тип предложения по строению: «Мы знали, что экскурсия начнётся утром.»", unit: "тип предложения", answer: ["сложноподчинённое", "сложноподчиненное"] },
        { id: "q9", num: 9, text: "Определите тип предложения по строению: «Пришла зима: озеро сковало льдом.»", unit: "тип предложения", answer: ["бессоюзное"] },
        { id: "q10", num: 10, text: "Сколько грамматических основ в предложении: «Когда рассвело туристы вышли из палатки и лес наполнился птичьим пением»?", unit: "число", answer: 3 },
      ]
    },
    {
      title: "Часть 3. Бессоюзное предложение и стили речи", meta: "4 задания · 8 баллов",
      questions: [
        { id: "q11", num: 11, text: "Выпишите главную часть сложноподчинённого предложения: «Если будет солнечно, мы пойдём гулять.»", unit: "часть предложения", answer: "мы пойдём гулять" },
        { id: "q12", num: 12, text: "Определите смысловые отношения между частями бессоюзного сложного предложения (можно вставить «а именно»): «Погода была ужасная: шёл ледяной дождь.»", unit: "смысловые отношения", answer: ["пояснение"] },
        { id: "q13", num: 13, text: "Определите стиль текста: «Прошу предоставить отпуск без сохранения заработной платы сроком на три дня в связи с семейными обстоятельствами.»", unit: "стиль речи", answer: ["официально-деловой"] },
        { id: "q14", num: 14, text: "Определите стиль текста: «Слушай, ты вообще как? Пойдём сегодня в кино, а?»", unit: "стиль речи", answer: ["разговорный"] },
      ]
    },
    {
      title: "Часть 4. Синтаксический разбор", meta: "2 задания · 6 баллов",
      questions: [
        { id: "q15", num: 15, text: "Сколько придаточных частей в предложении: «Я знаю, что ты придёшь.»?", unit: "число", answer: 1 },
        { id: "q16", num: 16, text: "Определите вид придаточного предложения: «Озеро, которое видно из окна, называется Онежским.»", unit: "вид придаточного", answer: ["определительное"] },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=3"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
