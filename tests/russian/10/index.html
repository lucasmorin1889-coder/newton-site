<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Входной тест по русскому языку — 10 класс — Ньютон</title>
<meta name="description" content="Диагностика знаний за начальную школу и с 5 по 9 класс для тех, кто перешёл в 10-й: орфография, средства выразительности, сложное предложение, культура речи. Бесплатный онлайн-тест от образовательного центра Ньютон, Петрозаводск.">
<link rel="canonical" href="https://newton-petrozavodsk.ru/tests/russian/10/">
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="stylesheet" href="/tests/engine.css?v=4">
</head>
<body>

<div id="app">
  <div class="brand">Образовательный центр «Ньютон»</div>

  <div id="intro">
    <h1 id="testTitle"></h1>
    <p class="desc" id="testDesc"></p>
    <div class="meta-row">
      <div class="m"><b id="metaDuration"></b><span>минут</span></div>
      <div class="m"><b id="metaQuestions"></b><span>заданий</span></div>
      <div class="m"><b id="metaScore"></b><span>баллов max</span></div>
    </div>
    <div class="form-card">
      <label for="studentName">ФИО ученика</label>
      <input type="text" id="studentName" placeholder="Иванова Мария Сергеевна">
      <label for="studentPhone">Телефон родителя</label>
      <input type="tel" id="studentPhone" placeholder="+79">
      <div class="consent-row">
        <input type="checkbox" id="studentConsent" required>
        <label for="studentConsent">Даю согласие на обработку персональных данных согласно ФЗ №152-ФЗ «О персональных данных»</label>
      </div>
      <button class="btn btn-primary" id="startBtn" disabled>Начать тест</button>
      <button class="btn btn-ghost" id="printBtn">Распечатать бланк (для очного тестирования)</button>
    </div>
  </div>

  <div id="testScreen" hidden>
    <div class="topbar">
      <span id="studentNameDisplay"></span>
      <b id="answeredCount"></b>
      <span id="timerDisplay"></span>
    </div>
    <div id="questionsRoot"></div>
    <button class="btn btn-primary" id="finishBtn">Завершить тест и получить результат</button>
  </div>

  <div id="resultScreen" hidden>
    <div id="resultRoot"></div>
  </div>

  <div id="printRoot"></div>
</div>

<script>
const TEST = {
  id: "russian_10",
  subject: "Русский язык",
  grade: "10 класс",
  title: "Входной тест по русскому языку",
  description: "Диагностика знаний за начальную школу и с 5 по 9 класс для тех, кто перешёл в 10-й: орфография, средства выразительности, сложное предложение, культура речи.",
  duration_min: 45,
  max_score: 30,
  total_questions: 16,
  sections: [
    {
      title: "Часть 1. Орфография", meta: "6 заданий · 8 баллов",
      questions: [
        { id: "q1", num: 1, text: "Вставьте букву в личном окончании глагола I спряжения: Ты пиш...шь письмо.", unit: "буква", answer: ["е"] },
        { id: "q2", num: 2, text: "Вставьте букву (слово-исключение): ветр...ый день", unit: "буква", answer: ["н"] },
        { id: "q3", num: 3, text: "Как пишется предлог в предложении «Несмотря на усталость, туристы продолжили путь.» — слитно или раздельно?", unit: "слитно/раздельно", answer: ["слитно"] },
        { id: "q4", num: 4, text: "Как пишется деепричастие в предложении «Он шёл, не смотря по сторонам.» — слитно или раздельно?", unit: "слитно/раздельно", answer: ["раздельно"] },
        { id: "q5", num: 5, text: "Верно ли: в корнях слов после шипящих под ударением пишется «ё», если в родственных словах есть чередование с «е» (например, «шёпот» — «шепчет»)?", unit: "да/нет", answer: ["да"] },
        { id: "q6", num: 6, text: "Вставьте букву в приставке перед глухим согласным: во...стание", unit: "буква", answer: ["с"] },
      ]
    },
    {
      title: "Часть 2. Средства выразительности и синтаксис", meta: "4 задания · 8 баллов",
      questions: [
        { id: "q7", num: 7, text: "Определите средство выразительности: «Онежское озеро дышало утренним туманом.»", unit: "средство выразительности", answer: ["олицетворение"] },
        { id: "q8", num: 8, text: "Определите средство выразительности: «Луна висела над лесом, как огромный круглый блин.»", unit: "средство выразительности", answer: ["сравнение"] },
        { id: "q9", num: 9, text: "Определите средство выразительности: «Он не спал уже сто лет.»", unit: "средство выразительности", answer: ["гипербола"] },
        { id: "q10", num: 10, text: "Определите вид придаточного предложения: «Лес, что растёт за деревней, называют старым бором.»", unit: "вид придаточного", answer: ["определительное"] },
      ]
    },
    {
      title: "Часть 3. Сложное предложение и культура речи", meta: "3 задания · 6 баллов",
      questions: [
        { id: "q11", num: 11, text: "Сколько грамматических основ в предложении: «Ветер утих дождь прекратился и выглянуло солнце»?", unit: "число", answer: 3 },
        { id: "q12", num: 12, text: "Какая связь — сочинительная или подчинительная — объединяет части предложения: «Ветер утих, дождь прекратился, и выглянуло солнце.»?", unit: "тип связи", answer: ["сочинительная"] },
        { id: "q13", num: 13, text: "Выберите правильный вариант: Мальчик (надел/одел) куртку и вышел на улицу.", unit: "слово", answer: ["надел"] },
      ]
    },
    {
      title: "Часть 4. Тип речи и морфология", meta: "3 задания · 8 баллов",
      questions: [
        { id: "q14", num: 14, text: "Сколько деепричастных оборотов в предложении: «Улыбаясь, она поздоровалась с гостями, не скрывая радости.»?", unit: "число", answer: 2 },
        { id: "q15", num: 15, text: "Сколько наречий в предложении: «Он неожиданно вошёл в кабинет.»?", unit: "число", answer: 1 },
        { id: "q16", num: 16, text: "Определите тип речи текста: «Утром мы вышли из палатки, спустились к озеру и разожгли костёр. Позавтракав, отправились дальше по тропе.»", unit: "тип речи", answer: ["повествование"] },
      ]
    }
  ]
};
</script>
<script src="/tests/engine.js?v=4"></script>
<script>NewtonTestEngine.init(TEST);</script>

</body>
</html>
